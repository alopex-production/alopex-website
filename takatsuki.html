<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>高月そら | ALOPEX production</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: #fff;
    font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", Arial, sans-serif;
}

/* HEADER */
header {
    width: 100%;
    padding: 28px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo img {
    width: 100px;
    height: auto;
}

.back {
    color: #fff;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 3px;
    opacity: .65;
    transition: opacity .3s;
}

.back:hover {
    opacity: 1;
}

/* MAIN */
.profile {
    max-width: 1250px;
    margin: 0 auto;
    padding: 80px 7% 140px;
}

.profile-number {
    font-size: 10px;
    letter-spacing: 5px;
    opacity: .45;
    margin-bottom: 35px;
}

.profile-grid {
    display: grid;
    grid-template-columns: 1fr 0.85fr;
    gap: 10%;
    align-items: start;
}

/* NAME */
.name-jp {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: clamp(52px, 7vw, 100px);
    font-weight: 400;
    letter-spacing: .08em;
    line-height: 1.15;
}

.name-en {
    margin-top: 15px;
    font-size: 12px;
    letter-spacing: 6px;
    opacity: .5;
}

.role {
    margin-top: 55px;
    font-size: 11px;
    letter-spacing: 4px;
}

/* LINE */
.line {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,.2);
    margin: 45px 0;
}

/* DATA */
.data-row {
    display: grid;
    grid-template-columns: 130px 1fr;
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.data-label {
    font-size: 9px;
    letter-spacing: 3px;
    opacity: .4;
}

.data-value {
    font-size: 13px;
    letter-spacing: 1px;
}

/* PHOTO */
.profile-photo {
    overflow: hidden;
}

.profile-photo img {
    width: 100%;
    height: 650px;
    object-fit: cover;
    object-position: center top;
    display: block;
}

/* SKILLS */
.skills {
    margin-top: 90px;
}

.section-label {
    font-size: 9px;
    letter-spacing: 5px;
    opacity: .4;
    margin-bottom: 25px;
}

.skills p {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: 20px;
    line-height: 2.2;
    letter-spacing: .08em;
}

/* FOOTER */
footer {
    border-top: 1px solid rgba(255,255,255,.1);
    padding: 35px 7%;
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    letter-spacing: 3px;
    opacity: .4;
}

/* MOBILE */
@media (max-width: 750px) {
    header {
        padding: 22px 6%;
    }

    .profile {
        padding-top: 50px;
    }

    .profile-grid {
        grid-template-columns: 1fr;
        gap: 55px;
    }

    .profile-photo {
        grid-row: 1;
    }

    .profile-photo img {
        height: auto;
        aspect-ratio: 4 / 5;
    }

    .name-jp {
        font-size: 48px;
    }

    .data-row {
        grid-template-columns: 100px 1fr;
    }
}
    /* ========================================
   PORTFOLIO
======================================== */

.portfolio {
    padding: 100px 6%;
    background: #080808;
}

.portfolio-header {
    margin-bottom: 45px;
}

.portfolio-label {
    font-size: 9px;
    letter-spacing: 6px;
    opacity: .45;
    margin-bottom: 15px;
}

.portfolio h2 {
    font-size: 38px;
    font-weight: 400;
    letter-spacing: 3px;
}

.portfolio-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.portfolio-grid img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
}

/* PORTFOLIO MOBILE */

@media (max-width: 750px) {

    .portfolio {
        padding: 70px 6%;
    }

    .portfolio-header {
        margin-bottom: 35px;
    }

    .portfolio h2 {
        font-size: 32px;
    }

    .portfolio-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .portfolio-grid img {
        aspect-ratio: 4 / 5;
    }
}
    .social a {
  display: inline-block;
  color: #ffffff;
  text-decoration: none;
  font-size: inherit;
  letter-spacing: 0.08em;
  transition: opacity 0.3s ease;
}

.social a:hover {
  opacity: 0.6;
}
</style>
